<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Melbaglory S</title>
  <meta name="description" content="Portfolio of Melbaglory S. Student developer building practical web tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="side">
    <a class="brand" href="index.html">Melbaglory S</a>
    <button class="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <p class="side-foot">Dindigul, TamilNadu<br><a href="#">https://github.com/MelbagloryS</a></p>
  </header>
  <main id="main">
    <section class="block narrow">
      <h2>Contact</h2>
      <p>Have a project, an internship opening or a question? Send me a message and I'll reply as soon as I can.</p>
      <form id="contact-form" novalidate>
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <p class="err" id="err-name"></p>
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="err" id="err-email"></p>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <p class="err" id="err-message"></p>
        <button class="btn" type="submit">Send message</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="alt">Or find me on <a href="https://github.com/MelbagloryS" target="_blank" rel="noopener">GitHub</a> and <a href="https://www.linkedin.com/in/melbaglory-s-384571386/" target="_blank" rel="noopener">LinkedIn</a>.</p>
    </section>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
